name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # The seed file is generated from src/data/recipes.js. If someone edits a
      # recipe and forgets to regenerate, the production table and the local
      # fallback drift apart silently — so fail the build instead.
      - name: Seed file is up to date
        run: |
          npm run seed:generate
          git diff --exit-code supabase/seed.sql \
            || (echo "::error::supabase/seed.sql is stale — run 'npm run seed:generate' and commit it." && exit 1)

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Box</title>
    <meta
      name="description"
      content="The recipes you saved, in a place you can actually find them. Paste a link, get a card you can cook from."
    />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)" />

    <!-- Without these, a link pasted into Slack or iMessage renders as a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Recipe Box" />
    <meta property="og:title" content="Recipe Box" />
    <meta
      property="og:description"
      content="The recipes you saved, in a place you can actually find them. Paste a link, get a card you can cook from."
    />
    <meta property="og:url" content="https://recipebox-lyart.vercel.app/" />
    <meta property="og:image" content="https://recipebox-lyart.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Recipe Box — the recipes you saved, in a place you can find them." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recipe Box" />
    <meta
      name="twitter:description"
      content="The recipes you saved, in a place you can actually find them."
    />
    <meta name="twitter:image" content="https://recipebox-lyart.vercel.app/og-image.png" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
